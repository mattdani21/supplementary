name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The quality gate must never reach a real provider.
  GAPOS_PROVIDER_MODE: fake

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Web build
        run: pnpm --filter @gapos/web build

  database:
    name: Migrations and integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gapos
          POSTGRES_PASSWORD: gapos
          POSTGRES_DB: gapos_test
        ports:
          - 5432:5432
        # The healthcheck names the database explicitly. pg_isready defaults to a database
        # matching the user, which does not exist here, so every probe logged
        # `FATAL: database "gapos" does not exist`. The check still passed — but a service log
        # full of benign FATALs is how a real one goes unread, which is exactly how the audio
        # constraint bug survived a green build. See tasks/decisions.md.
        options: >-
          --health-cmd "pg_isready -U gapos -d gapos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: quay.io/minio/minio:RELEASE.2024-10-02T17-50-41Z
        env:
          MINIO_ROOT_USER: gapos
          MINIO_ROOT_PASSWORD: gapos-s3
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        command: server /data
    env:
      GAPOS_TEST_DATABASE_URL: postgres://gapos:gapos@localhost:5432/gapos_test
      GAPOS_S3_ENDPOINT: http://127.0.0.1:9000
      GAPOS_S3_BUCKET: gapos-test
      GAPOS_S3_ACCESS_KEY_ID: gapos
      GAPOS_S3_SECRET_ACCESS_KEY: gapos-s3
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create the MinIO bucket
        env:
          AWS_ACCESS_KEY_ID: gapos
          AWS_SECRET_ACCESS_KEY: gapos-s3
          AWS_DEFAULT_REGION: us-east-1
        run: |
          # dl.min.io now serves HTTP 410 instead of the `mc` binary (MinIO ended public
          # client downloads). The ubuntu runner already has the AWS CLI; create the
          # test bucket over the S3 API with path-style addressing for 127.0.0.1.
          aws configure set default.s3.addressing_style path
          aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket gapos-test
          aws --endpoint-url http://127.0.0.1:9000 s3api head-bucket --bucket gapos-test

      - name: Migrate from an empty database
        run: pnpm db:migrate

      - name: Migrate again (idempotency)
        run: pnpm db:migrate

      - name: Repository contract against Postgres
        run: pnpm test packages/database

      - name: SigV4 client against real MinIO (GAP-024)
        run: pnpm test tests/end-to-end/s3-smoke.test.ts

      # The repository suite proves each method in isolation; this proves the product works on
      # the SQL implementation.
      - name: End-to-end journey against Postgres
        run: pnpm test tests/end-to-end/postgres-journey.test.ts
