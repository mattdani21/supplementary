tasks:
  - id: E20
    title: HTTP API and deployment surface
    priority: P0
    dependencies: [E11, E3, E13]
    evidence: The product is reachable over HTTP; a deployment boots with env config only

  - id: GAP-000
    title: Establish the monorepo, tooling and agent protocol
    epic: E0
    priority: P0
    status: done
    goal: A fresh checkout is productive with one command and a single quality gate.
    scope:
      - pnpm workspace, TypeScript, eslint, prettier, vitest
      - AGENTS.md, PRODUCT.md, ARCHITECTURE.md, SECURITY.md, OPERATIONS.md
      - ADRs for stack, queue and AI provider boundary
      - backlog schema and status file
      - continuous integration workflow
    out_of_scope:
      - product features
      - deployment infrastructure
    dependencies: []
    acceptance:
      - pnpm install succeeds from a clean checkout
      - pnpm verify runs format, lint, typecheck and tests
      - lint fails when domain imports a web framework or a provider SDK
    verification:
      - pnpm verify
    risk: low
    human_gate: false

  - id: GAP-001
    title: Create the gap state machine
    epic: E2
    priority: P0
    status: done
    goal: Enforce a valid gap lifecycle so status can never be set arbitrarily.
    scope:
      - domain transition function
      - typed domain errors
      - unit tests over the full transition matrix
    out_of_scope:
      - UI animation
      - analytics
    dependencies: [GAP-000]
    acceptance:
      - invalid transitions return a typed domain error rather than throwing a string
      - consumption cannot directly set filled
      - tests cover every permitted transition and a sample of forbidden ones
    verification:
      - pnpm test:domain
      - pnpm typecheck
    risk: low
    human_gate: false

  - id: GAP-002
    title: Create the generation run state machine and step idempotency keys
    epic: E0
    priority: P0
    status: done
    goal: Model the pipeline lifecycle so retries cannot duplicate work.
    scope:
      - generation status transitions
      - step key derivation from run, step name and input version
      - unit tests for idempotent re-entry
    out_of_scope:
      - the actual pipeline stages
    dependencies: [GAP-000]
    acceptance:
      - every terminal status rejects further transitions
      - re-running a completed step returns the existing output rather than recomputing
      - partial is reachable only from repairing or publishing
    verification:
      - pnpm test:domain
    risk: low
    human_gate: false

  - id: GAP-003
    title: Define the AI contracts and the deterministic fake provider
    epic: E0
    priority: P0
    status: done
    goal: Every structured model call has a versioned schema and a deterministic fake.
    scope:
      - zod contracts for normalisation, planning, lesson, question and verification
      - LanguageModel, SpeechToText and TextToSpeech interfaces
      - fake provider driven by fixtures, including deliberately faulty responses
    out_of_scope:
      - real provider implementations
    dependencies: [GAP-000]
    acceptance:
      - an invalid provider response fails validation at the adapter boundary
      - every contract object carries a schema version
      - the fake provider is selected by default so no test can spend money
    verification:
      - pnpm test packages/ai-contracts packages/provider-adapters
    risk: low
    human_gate: false

  - id: GAP-004
    title: Implement the ownership model and repositories
    epic: E1
    priority: P0
    status: done
    goal: No query can return another learner's data.
    scope:
      - forward-only migrations for the core entities
      - repository interfaces taking an owner on every read and write
      - in-memory implementation for tests, Postgres implementation for runtime
    out_of_scope:
      - vector search tuning
    dependencies: [GAP-000]
    acceptance:
      - a repository read for owner A cannot return a row owned by B
      - there is no repository method that fetches by id without an owner
      - migrations run from an empty database
    verification:
      - pnpm test packages/database
    risk: medium
    human_gate: false

  - id: GAP-005
    title: Build the fixture-based vertical slice
    epic: E2
    priority: P0
    status: done
    goal: The whole product journey works end to end on deterministic fixture content.
    scope:
      - gap CRUD through the API
      - mock compiler producing a fixed curriculum
      - practice submission and basic mastery
      - capability library read
    out_of_scope:
      - real generation
      - real audio
    dependencies: [GAP-001, GAP-002, GAP-003, GAP-004]
    acceptance:
      - the primary journey passes without any external AI dependency
      - a compile with a repeated idempotency key produces exactly one run
      - a gap cannot reach filled without mastery evidence
    verification:
      - pnpm test tests/end-to-end
    risk: medium
    human_gate: false

  - id: GAP-006
    title: Implement source ingestion with structural locators
    epic: E3
    priority: P0
    status: done
    goal: Lesson claims can be traced back to a page, heading or timestamp in a source.
    scope:
      - upload registration and private storage
      - plain-text and markdown extraction
      - semantic chunking preserving locators
      - checksum-addressed extraction cache
    out_of_scope:
      - OCR
      - audio and video transcription
    dependencies: [GAP-004]
    acceptance:
      - chunks carry a locator that identifies their position in the original document
      - re-ingesting an identical file reuses the cached extraction
      - an unsupported or encrypted file is rejected with a clear machine-readable code
    verification:
      - pnpm test packages/database
    risk: medium
    human_gate: false

  - id: GAP-007
    title: Implement gap normalisation and the diagnostic flow
    epic: E4
    priority: P0
    status: done
    goal: Turn a raw learner statement into a structured, checkable specification.
    scope:
      - stage A normalisation through the language model adapter
      - ambiguity handling and labelled assumptions
      - diagnostic questions with a skip-and-infer path
    out_of_scope:
      - adaptive difficulty within the diagnostic
    dependencies: [GAP-003, GAP-005]
    acceptance:
      - a material ambiguity produces a clarification request rather than a silent guess
      - skipping the diagnostic records a labelled conservative baseline and a Day 1 calibration
      - normalisation output is schema-valid before persistence
    verification:
      - pnpm test packages/domain packages/ai-contracts
    risk: medium
    human_gate: false

  - id: GAP-008
    title: Implement the curriculum planner and plan validation
    epic: E4
    priority: P0
    status: done
    goal: Reject a plan that cannot fit, cannot be assessed, or depends on an unmet prerequisite.
    scope:
      - stage D planning contract
      - objective coverage checks
      - time budget validation
      - prerequisite graph validation
    out_of_scope:
      - lesson prose
    dependencies: [GAP-006, GAP-007]
    acceptance:
      - a plan exceeding the learner's daily minutes is rejected with a typed error
      - an objective with no assessment item is rejected
      - a prerequisite cycle is rejected
      - every objective maps to source evidence or is explicitly labelled general knowledge
    verification:
      - pnpm test packages/domain
    risk: high
    human_gate: false

  - id: GAP-009
    title: Generate lessons in bounded parallel with a shared glossary
    epic: E5
    priority: P0
    status: done
    goal: Seven lesson packages that agree on terminology and cover the plan.
    scope:
      - lesson generation contract
      - bounded concurrency
      - immutable plan, glossary and objective identifiers
      - versioned artefacts
    out_of_scope:
      - audio
    dependencies: [GAP-008]
    acceptance:
      - parallel generation cannot introduce a term outside the shared glossary
      - each lesson package contains a script, transcript, summary, examples, pause prompts and questions
      - artefact versions are immutable once an attempt references them
    verification:
      - pnpm test packages/domain tests/evaluation
    risk: high
    human_gate: false

  - id: GAP-010
    title: Implement the independent verifier and the targeted repair loop
    epic: E6
    priority: P0
    status: done
    goal: Nothing is published that the system has not independently checked.
    scope:
      - independent solving of each objective question
      - distractor, leakage, difficulty and source-support checks
      - repair of only the failed artefact, maximum two attempts
      - partial publication when coverage survives
    out_of_scope:
      - human review workflow
    dependencies: [GAP-009]
    acceptance:
      - a deliberately faulty provider fixture is rejected and then repaired
      - a question whose answer leaks into the prompt is rejected
      - a third repair attempt is never made; the run goes partial instead
      - a verifier cannot approve its own generated output
    verification:
      - pnpm test packages/domain tests/evaluation
    risk: high
    human_gate: false

  - id: GAP-011
    title: Synthesise segmented audio and publish incrementally
    epic: E7
    priority: P0
    status: done
    goal: Day 1 becomes playable before the rest of the course finishes.
    scope:
      - text-to-speech adapter and segmentation
      - audio and transcript integrity checks
      - incremental publication
      - text-only fallback
    out_of_scope:
      - voice selection UI
    dependencies: [GAP-010]
    acceptance:
      - Day 1 publishes before later days complete
      - an audio failure falls back to transcript without losing the curriculum
      - published audio duration and transcript checksum are verified before publication
    verification:
      - pnpm test packages/domain packages/provider-adapters
    risk: medium
    human_gate: false

  - id: GAP-012
    title: Implement attempts, mastery evidence and review scheduling
    epic: E9
    priority: P0
    status: done
    goal: A gap fills on evidence, never on consumption.
    scope:
      - attempt recording with hints and confidence
      - objective-level evidence aggregation
      - fixed review ladder
      - remediation generation for repeated errors
    out_of_scope:
      - adaptive spaced repetition
    dependencies: [GAP-005]
    acceptance:
      - listening to every lesson without practice cannot fill a gap
      - an objective needs two sessions, one unhinted item and one transfer item to be mastered
      - a wrong answer schedules a due remediation item
      - review intervals follow the documented ladder
    verification:
      - pnpm test packages/domain
    risk: high
    human_gate: false

  - id: GAP-013
    title: Implement the capability library and prerequisite reuse
    epic: E10
    priority: P0
    status: done
    goal: A filled gap becomes a reusable capability.
    scope:
      - capability search
      - knowledge edges between capabilities
      - prerequisite satisfaction from prior mastery, with decay
    out_of_scope:
      - graph visualisation
    dependencies: [GAP-012]
    acceptance:
      - a filled gap is discoverable through search
      - a prior mastered capability satisfies a prerequisite in a new curriculum
      - decayed evidence stops satisfying the prerequisite and triggers a diagnostic
    verification:
      - pnpm test packages/domain
    risk: medium
    human_gate: false

  - id: GAP-014
    title: Build the reference evaluation pack and scoring harness
    epic: E13
    priority: P0
    status: done
    goal: Detect software that works technically but teaches badly.
    scope:
      - ten copyright-safe fixtures across the required domains
      - scoring for coverage, faithfulness, solvability, difficulty, duration and leakage
      - stored scores and regression comparison
    out_of_scope:
      - a hosted dashboard
    dependencies: [GAP-010, GAP-012]
    acceptance:
      - each fixture declares expected objectives, prohibited content and failure traps
      - the harness fails the build when a score regresses beyond tolerance
      - the prompt-injection fixture is detected and reported rather than obeyed
    verification:
      - pnpm test tests/evaluation
    risk: high
    human_gate: false

  - id: GAP-015
    title: Enforce cost ceilings, rate limits and operational recovery
    epic: E11
    priority: P0
    status: done
    goal: A run cannot overspend, and a restart cannot corrupt a run.
    scope:
      - per-run and per-user budgets checked before each call
      - queue leases, retries and dead-letter handling
      - telemetry for every stage
    out_of_scope:
      - a billing integration
    dependencies: [GAP-011, GAP-012]
    acceptance:
      - a run that would exceed its budget degrades to text-only instead of overspending
      - killing a worker mid-run and restarting produces no duplicate artefacts or charges
      - a job failing repeatedly is dead-lettered with its last error and reproduction context
    verification:
      - pnpm test packages/observability packages/domain
    risk: high
    human_gate: false

  - id: GAP-004b
    title: Implement the Postgres repositories behind the existing interfaces
    epic: E1
    priority: P0
    status: done
    goal: Run the same repository suite against Postgres, not only the in-memory implementation.
    scope:
      - Postgres implementation of every repository interface in packages/database
      - the ownership suite parameterised so it runs against both implementations
      - pgvector-backed chunk retrieval behind SourceRepository.searchChunks
    out_of_scope:
      - retrieval quality tuning
    dependencies: [GAP-004]
    acceptance:
      - the identical ownership suite passes against Postgres and against memory
      - a cross-tenant read returns nothing at the SQL level, not only in application code
      - searchChunks uses the vector index and still enforces the owner and gap boundary
    verification:
      - GAPOS_TEST_DATABASE_URL=... pnpm test packages/database
    risk: medium
    human_gate: false
    notes: >
      Done. The contract suite in shared-suite.ts runs against both implementations, so a test
      that passes for one and fails for the other is a bug in one of them. The full end-to-end
      journey also runs against Postgres in CI. Vector retrieval is still lexical (full-text
      ranking); the vector index is GAP-018.

  - id: GAP-014b
    title: Score the nine live-provider evaluation fixtures
    epic: E13
    priority: P0
    status: done
    goal: Run the whole reference pack against a real provider, not only fixture 1.
    scope:
      - a live LanguageModel backend behind the existing interface
      - scoring the nine fixtures marked requiresLiveProvider
      - stored baselines per fixture and per dimension
    out_of_scope:
      - provider routing policy
    dependencies: [GAP-014]
    acceptance:
      - every fixture in the pack produces a scorecard, not only eval_01
      - each fixture meets its floors, or its failure is recorded with the dimension that caught it
      - the underspecified fixture produces a clarification request rather than a curriculum
      - the injection fixture is reported as a finding and does not influence the curriculum
    verification:
      - GAPOS_PROVIDER_MODE=live pnpm test tests/evaluation
    risk: high
    human_gate: true
    notes: >
      Blocked, not skipped. The deterministic fake returns the set-theory reference content for
      every request, so only eval_01 can be scored today; the other nine declare their expected
      objectives, prohibited content, failure traps and rubrics so they are ready to run rather
      than being invented later under time pressure. Adding a live provider creates paid external
      resources, which is a human approval gate (AGENTS.md §5).

  - id: GAP-018
    title: Replace lexical chunk retrieval with the vector index
    epic: E3
    priority: P1
    status: done
    goal: Retrieve source evidence by meaning rather than by shared words.
    scope:
      - an embedding column on source_chunks behind a new forward-only migration
      - embedding generation through the provider adapter
      - SourceRepository.searchChunks backed by the vector index
    out_of_scope:
      - reranking
      - hybrid scoring weights
    dependencies: [GAP-004b]
    acceptance:
      - a chunk that answers the query but shares no words with it is retrieved
      - retrieval still cannot cross an owner or a gap boundary
      - the contract suite passes unchanged against both implementations
    verification:
      - GAPOS_TEST_DATABASE_URL=... pnpm test packages/database
    risk: medium
    human_gate: false
    notes: >
      Both implementations currently retrieve on lexical overlap - term matching in memory,
      to_tsvector ranking in Postgres. That is enough to prove the ownership and gap boundaries,
      which is what the contract suite asserts, but it will miss a paraphrase.

  - id: GAP-020
    title: Worker daemon entrypoint
    epic: E11
    priority: P0
    status: ready
    goal: The queue loop runs as a process that can be deployed.
    scope:
      - an executable entrypoint (env-driven bootstrap: database URL, provider mode, poll interval)
      - graceful shutdown on SIGTERM/SIGINT (finish the in-flight job, stop claiming, release the lease)
      - startup and shutdown log lines and health observability
      - a bin script in apps/worker so deployments can start it directly
    out_of_scope:
      - process supervision (systemd/k8s)
      - horizontal scaling beyond the lease protocol
    dependencies: [GAP-015]
    acceptance:
      - starting the daemon against an in-memory queue, enqueueing a compile, and stopping it
        completes the job and shuts down cleanly
      - SIGTERM during a run stops claiming and releases the lease
  - id: GAP-021
    title: HTTP API over the service layer
    epic: E20
    priority: P0
    status: ready
    goal: Every capability of the engine is reachable over HTTP.
    scope:
      - Next.js route handlers over the existing services (no second HTTP server)
      - gaps: create, list, get, transition, compile
      - sources: register text, upload a file to object storage
      - learning: curriculum, lesson content, audio URL, submit an attempt, mastery summary
      - owner scoping via an X-Owner-Id header; zod validation on every body
    out_of_scope:
      - authentication beyond the owner header (single-learner deployments)
      - rate limiting
    dependencies: [GAP-013, GAP-015]
    acceptance:
      - handler logic is tested in-process (no sockets): every endpoint maps errors to HTTP
      - a compiled gap serves lessons, audio and mastery over HTTP
  - id: GAP-022
    title: Web application and offline PWA (E14)
    epic: E14
    priority: P1
    status: ready
    goal: A learner can run the whole loop in a browser.
    scope:
      - Next.js app router pages — gap list, gap detail with source upload and compile, curriculum,
        lesson player (content, audio, attempt form), mastery view
      - app manifest and a service worker caching the app shell
      - the published lesson for the current day works when the network is cut after first load
    out_of_scope:
      - native mobile
      - real-time collaboration
    dependencies: [GAP-021]
    acceptance:
      - next build succeeds in CI
      - offline: after first load, the lesson page renders with the network disconnected
  - id: GAP-023
    title: Live speech-to-text and a real live-mode factory
    epic: E20
    priority: P0
    status: ready
    goal: Live mode boots through the standard factory instead of throwing.
    scope:
      - an OpenAI-compatible /audio/transcriptions backend over plain fetch
      - "createProviders({ mode: 'live' }) assembles language model, TTS, STT and embeddings"
      - GAPOS_STT_* env configuration mirroring the other live adapters
    out_of_scope:
      - STT streaming
      - wake-word or diarization
    dependencies: []
    acceptance:
      - the live factory assembles all four adapters with env config and no throw
      - the STT backend is tested against a scripted fetch (multipart round trip)
  - id: GAP-024
    title: Real S3 smoke test in CI
    epic: E11
    priority: P0
    status: ready
    goal: The SigV4 client is proven against a real S3 endpoint, not just the mock.
    scope:
      - a MinIO service in the CI workflow
      - a smoke test (loud skip without GAPOS_S3_* env): put/get/presign/delete against real MinIO
    out_of_scope:
      - a MinIO service for local development (infra/local already has docker compose)
    dependencies: [GAP-006]
    acceptance:
      - the database CI job starts MinIO and the smoke test passes against it
  - id: GAP-025
    title: Command-line study client
    epic: E20
    priority: P1
    status: ready
    goal: The whole loop is usable from a terminal.
    scope:
      - a `gapos` bin — gap new, source add (file or stdin), compile, plan, study (lesson + attempt),
        mastery, status
      - in-process service layer with Postgres or in-memory storage selected by env
      - readline prompts; non-interactive flags for scripting
    out_of_scope:
      - ncurses/TUI rendering
      - repl
    dependencies: [GAP-021]
    acceptance:
      - a scripted session (new gap, add source, compile, study) runs end to end without a server
  - id: GAP-026
    title: Operations documentation for the deployment surface
    epic: E20
    priority: P1
    status: ready
    goal: A fresh deployment is startable from the docs.
    scope:
      - OPERATIONS.md: API, daemon, UI, MinIO, live-mode env table, CLI usage
      - README quickstart updated
    out_of_scope:
      - hosting-specific runbooks
    dependencies: [GAP-020, GAP-021, GAP-022, GAP-023, GAP-024, GAP-025]
    acceptance:
      - a reader can start the API, the daemon and the UI with env config only
  - id: GAP-027
    title: Knowledge map (E15)
    epic: E15
    priority: P1
    status: ready
    goal: The prerequisite graph is navigable.
    scope:
      - a knowledge endpoint: nodes (gaps, capabilities) and edges from mastery and curricula
      - a map page rendering the graph as SVG with no new dependencies
      - clicking a node opens the gap
    out_of_scope:
      - interactive graph manipulation
      - layout algorithms beyond a deterministic radial/tree placement
    dependencies: [GAP-021, GAP-022, GAP-013]
    acceptance:
      - after mastering two linked gaps the map shows the edge and both nodes
  - id: GAP-028
    title: Voice gap capture (E16)
    epic: E16
    priority: P1
    status: ready
    goal: Dictation creates an editable draft gap.
    scope:
      - POST audio to a voice endpoint that transcribes (provider STT) and drafts a gap
      - a capture UI (mic record, send, edit the draft, create)
    out_of_scope:
      - speaker recognition
    dependencies: [GAP-021, GAP-022, GAP-023]
    acceptance:
      - with the fake STT scripted, a recorded blob becomes a draft whose text matches
  - id: GAP-029
    title: Provider routing by policy (E17)
    epic: E17
    priority: P2
    status: ready
    goal: Call purpose selects the model.
