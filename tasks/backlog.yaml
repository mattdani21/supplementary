# GapOS backlog.
#
# This file is the task graph the controller agent selects from. It is the plan.
# tasks/status.json is the record of what actually happened, with evidence.
#
# Rules:
#   - status is one of: ready | blocked | in_progress | done
#   - a task may only be selected when every dependency is done
#   - no task may use "implement feature" as its only acceptance criterion
#   - acceptance criteria must be checkable by a command in `verification`

version: 1

