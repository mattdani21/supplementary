name: gapos-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gapos
      POSTGRES_PASSWORD: gapos
      POSTGRES_DB: gapos
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gapos']
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gapos
      MINIO_ROOT_PASSWORD: gapos-local-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  storage-data:
